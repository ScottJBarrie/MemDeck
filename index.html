<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deck">
<title>Deck</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: #000; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
#app {
  height: 100dvh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
}
#num {
  width: 100%; max-width: 340px;
  font-size: 24vw; font-weight: 200; text-align: center;
  letter-spacing: 0.08em;
  background: transparent; border: none; outline: none;
  color: #fff; font-variant-numeric: tabular-nums;
  -webkit-user-select: text; user-select: text;
}
#num::placeholder { color: #1a1a1a; }
#hint {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom) + 24px);
  font-size: 13px; color: #2e2e2e; letter-spacing: 0.05em;
}
#miss { display: none; font-size: 15px; color: #666; margin-top: 8px; }
#card {
  position: fixed; inset: 0; z-index: 10;
  display: none; align-items: center; justify-content: center;
  background: #000;
}
#card.show { display: flex; }
#card img { max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
</head>
<body>
<div id="app">
  <input id="num" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2"
         placeholder="00" autocomplete="off" autocorrect="off" spellcheck="false">
  <div id="miss">nothing at that number</div>
  <div id="hint">type two digits</div>
</div>
<div id="card"><img id="img" alt=""></div>

<script>
var num  = document.getElementById('num');
var card = document.getElementById('card');
var img  = document.getElementById('img');
var miss = document.getElementById('miss');

function show(n) {
  miss.style.display = 'none';
  var triedJpg = false;
  img.onload = function () {
    card.classList.add('show');
    num.blur();
  };
  img.onerror = function () {
    if (!triedJpg) { triedJpg = true; img.src = n + '.jpg'; return; }
    card.classList.remove('show');
    miss.style.display = 'block';
  };
  img.src = n + '.png';
}
num.addEventListener('input', function () {
  num.value = num.value.replace(/[^0-9]/g, '');
  miss.style.display = 'none';
  if (num.value.length === 2) show(num.value);
});

function reset() {
  card.classList.remove('show');
  img.removeAttribute('src');
  miss.style.display = 'none';
  num.value = '';
  num.focus();
}

card.addEventListener('click', reset);
document.getElementById('app').addEventListener('click', function (e) {
  if (e.target !== num) num.focus();
});

window.addEventListener('load', function () { num.focus(); });
</script>
</body>
</html>
